<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="omni-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07291e" />
      <stop offset="100%" stop-color="#02100b" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="omni-glow" cx="70%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#a3e65d" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#46cf2c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#02100b" stop-opacity="0" />
    </radialGradient>

    <!-- Bar Gradient -->
    <linearGradient id="bar-gradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#225417" />
      <stop offset="50%" stop-color="#3ca826" />
      <stop offset="100%" stop-color="#8ee23c" />
    </linearGradient>

    <!-- Trendline Gradient -->
    <linearGradient id="line-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#a3e65d" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#omni-bg)" />
  <rect width="64" height="64" rx="16" fill="url(#omni-glow)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#1d5c34" stroke-width="1.5" />

  <!-- Metric Columns (Data Foundation) -->
  <rect x="13" y="37" width="6.5" height="14" rx="3.25" fill="#1b4515" />
  <rect x="23" y="29" width="6.5" height="22" rx="3.25" fill="#276b1e" />
  <rect x="33" y="23" width="6.5" height="28" rx="3.25" fill="#389427" />
  <rect x="43" y="17" width="6.5" height="34" rx="3.25" fill="url(#bar-gradient)" />

  <!-- Dynamic Trendline (Insight to Action) -->
  <path d="M 16 34 L 26 25 L 36 21 L 46 11" fill="none" stroke="url(#line-gradient)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Metric Data Nodes -->
  <circle cx="16" cy="34" r="2.25" fill="#86efac" />
  <circle cx="26" cy="25" r="2.5" fill="#a3e65d" />
  <circle cx="36" cy="21" r="2.5" fill="#bef264" />
  
  <!-- Active AI Insight Node -->
  <circle cx="46" cy="11" r="3.5" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#glow)" />
</svg>